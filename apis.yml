name: Altera
description: >-
  Altera is an applied AI research company founded in December 2023 by former
  MIT computational neuroscientist Robert Yang, building "digital human beings"
  — autonomous, collaborative, and socially intelligent AI agents. Its research
  began with multi-agent experiments in games such as Minecraft and Roblox
  (agents that can play alongside a person like a friend), and produced Project
  Sid, a large-scale AI-agent civilization powered by its PIANO architecture.
  The team is drawn from MIT EECS, the Stanford NLP Group, Google X, and
  Citadel. Altera raised a $2M pre-seed and a $9M seed (backers include a16z
  SPEEDRUN, Patron, First Spark Ventures, and Eric Schmidt) and has since
  rebranded to Fundamental Research Labs following a $33M Series A led by Prosus.
  Altera is a research organization and does not currently publish a public API,
  developer portal, OpenAPI definition, or client SDKs; its only public
  developer surface is the altera-al GitHub organization (the project-sid
  research codebase).
